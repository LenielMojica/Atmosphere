<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style></style>
  </head>

  <body>
    <div class="app-wrapper">
      <header class="app-header">
        <div class="brand-title">
          <i class="fa-solid fa-cloud-bolt"></i>
          <span id="title">Atmosphere</span>
        </div>

        <div class="search-container">
          <form class="search-form" id="search-form">
            <input
              type="text"
              class="search-input"
              placeholder="Search city..."
            />
            <button type="submit" class="search-btn" aria-label="Search">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </form>

          <!-- Temperature Unit Toggle Toggle -->
          <div class="unit-toggle" id="unit-toggle">
            <button class="unit-btn active" id="unit-c">°C</button>
            <button class="unit-btn" id="unit-f">°F</button>
          </div>
        </div>
      </header>

      <main class="weather-grid">
        <div class="main-section">
          <section class="glass-card hero-card"></section>

          <section class="glass-card hourly-section">
            <h3 class="section-title">
              <i class="fa-regular fa-clock"></i> Hourly Forecast
            </h3>
            <div class="hourly-track"></div>
          </section>

          <section class="metrics-grid"></section>
        </div>

        <aside class="glass-card sidebar-section">
          <h3 class="section-title">
            <i class="fa-regular fa-calendar-days"></i> 7-Day Forecast
          </h3>

          <div class="daily-list">
           
            </div>
          </div>
        </aside>
      </main>
    </div>
    <div class="error-backdrop" id="error-backdrop" role="alertdialog" aria-modal="true" aria-labelledby="error-title">
  <div class="error-modal">
    <div class="error-header">
      <i class="fa-solid fa-triangle-exclamation error-icon"></i>
      <h2 id="error-title">Something went wrong</h2>
      <span class="error-status" id="error-status"></span>
    </div>
    <p class="error-message" id="error-message"></p>
    <button type="button" class="error-close" id="error-close-btn">Dismiss</button>
  </div>
</div>
  </body>
</html>
